<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROJECT SIGMA — Countdown</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --green-dark: #1a5c2a;
    --green-mid: #2e8b3e;
    --green-light: #4db848;
    --yellow: #f5e000;
    --red: #c0392b;
    --grey: #4a4a4a;
    --white: #f8f8f8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background-color: #0d1a10;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(26,92,42,0.35) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(245,224,0,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 60% 80%, rgba(192,57,43,0.12) 0%, transparent 50%);
    font-family: 'Barlow', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Animated geometric background shapes */
  .bg-shapes {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .shape {
    position: absolute;
    opacity: 0.04;
    animation: drift 20s infinite ease-in-out;
  }

  .shape-1 {
    width: 400px; height: 400px;
    background: var(--green-light);
    clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
    top: -100px; left: -100px;
    animation-delay: 0s;
  }
  .shape-2 {
    width: 300px; height: 300px;
    background: var(--yellow);
    clip-path: polygon(0% 0%, 100% 0%, 100% 100%);
    bottom: -80px; right: -80px;
    animation-delay: -7s;
  }
  .shape-3 {
    width: 250px; height: 250px;
    background: var(--red);
    clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
    top: 40%; right: 5%;
    animation-delay: -13s;
  }

  @keyframes drift {
    0%, 100% { transform: translate(0,0) rotate(0deg); }
    33%       { transform: translate(20px, -30px) rotate(5deg); }
    66%       { transform: translate(-15px, 20px) rotate(-3deg); }
  }

  /* Scanline overlay */
  body::after {
    content: '';
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.03) 2px,
      rgba(0,0,0,0.03) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  /* Main container */
  .container {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 40px 60px;
    max-width: 900px;
    width: 90%;
  }

  /* Logo */
  .logo-wrap {
    margin-bottom: 30px;
    opacity: 0;
    animation: fadeDown 1s ease forwards 0.3s;
  }

  .logo-wrap img {
    height: 70px;
    filter: drop-shadow(0 4px 16px rgba(77,184,72,0.3));
  }

  /* Divider bar */
  .divider {
    width: 80px;
    height: 3px;
    background: linear-gradient(90deg, var(--yellow), var(--green-light), var(--red));
    margin: 0 auto 28px;
    opacity: 0;
    animation: fadeUp 1s ease forwards 0.6s;
  }

  /* Project label */
  .label {
    font-family: 'Barlow', sans-serif;
    font-weight: 300;
    font-size: 13px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: rgba(248,248,248,0.45);
    margin-bottom: 8px;
    opacity: 0;
    animation: fadeUp 1s ease forwards 0.7s;
  }

  /* Project title */
  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(52px, 10vw, 96px);
    letter-spacing: 10px;
    color: var(--white);
    line-height: 1;
    margin-bottom: 6px;
    text-shadow: 0 0 40px rgba(77,184,72,0.4);
    opacity: 0;
    animation: fadeUp 1s ease forwards 0.8s;
  }

  h1 span {
    color: var(--green-light);
  }

  /* Subtitle */
  .subtitle {
    font-size: 12px;
    letter-spacing: 4px;
    color: rgba(248,248,248,0.3);
    text-transform: uppercase;
    margin-bottom: 50px;
    opacity: 0;
    animation: fadeUp 1s ease forwards 1s;
  }

  /* Countdown grid */
  .countdown {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 50px;
    opacity: 0;
    animation: fadeUp 1s ease forwards 1.2s;
  }

  .unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 130px;
  }

  .num-box {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(77,184,72,0.2);
    border-top: 3px solid var(--green-light);
    border-radius: 4px;
    width: 130px;
    height: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(10px);
    transition: border-color 0.3s;
  }

  .num-box::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
    animation: shimmer 4s infinite;
  }

  @keyframes shimmer {
    0%   { left: -100%; }
    100% { left: 200%; }
  }

  .num-box:hover {
    border-color: rgba(77,184,72,0.6);
  }

  .num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 68px;
    color: var(--white);
    line-height: 1;
    text-shadow: 0 0 20px rgba(77,184,72,0.5);
    transition: transform 0.15s ease;
  }

  .num.tick {
    transform: scale(1.08);
    color: var(--green-light);
  }

  .unit-label {
    font-family: 'Barlow', sans-serif;
    font-weight: 600;
    font-size: 10px;
    letter-spacing: 4px;
    color: rgba(248,248,248,0.4);
    text-transform: uppercase;
    margin-top: 12px;
  }

  /* Colon separator */
  .colon {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 60px;
    color: rgba(77,184,72,0.4);
    padding-top: 35px;
    animation: blink 1s step-end infinite;
    min-width: 20px;
    text-align: center;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.1; }
  }

  /* Target date */
  .target-date {
    font-size: 11px;
    letter-spacing: 3px;
    color: rgba(248,248,248,0.25);
    text-transform: uppercase;
    opacity: 0;
    animation: fadeUp 1s ease forwards 1.5s;
  }

  .target-date span {
    color: rgba(245,224,0,0.6);
  }

  /* Bottom bar */
  .bottom-bar {
    position: fixed;
    bottom: 0; left: 0;
    width: 100%;
    height: 4px;
    background: linear-gradient(90deg, var(--red), var(--yellow), var(--green-light), var(--green-dark));
    z-index: 20;
  }

  /* Animations */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Expired state */
  .expired-msg {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    color: var(--green-light);
    letter-spacing: 6px;
    display: none;
  }

  @media (max-width: 600px) {
    .unit { min-width: 70px; }
    .num-box { width: 70px; height: 70px; }
    .num { font-size: 36px; }
    .colon { font-size: 30px; padding-top: 20px; }
    .container { padding: 30px 20px; }
  }
</style>
</head>

<script>
  const target = new Date("April 1, 2026 23:44:00").getTime();

  const dEl = document.getElementById('days');
  const hEl = document.getElementById('hours');
  const mEl = document.getElementById('minutes');
  const sEl = document.getElementById('seconds');
  const expiredEl = document.getElementById('expired');
  const countdownEl = document.getElementById('countdown');

  let prevSec = -1;

  function pad(n) { return String(n).padStart(2, '0'); }

  function tick(el, val) {
    el.classList.remove('tick');
    void el.offsetWidth;
    el.textContent = pad(val);
    el.classList.add('tick');
    setTimeout(() => el.classList.remove('tick'), 150);
  }

  function update() {
    const now = Date.now();
    const diff = target - now;

    if (diff <= 0) {
      countdownEl.style.display = 'none';
      expiredEl.style.display = 'block';
      return;
    }

    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);

    if (s !== prevSec) {
      tick(sEl, s);
      tick(mEl, m);
      tick(hEl, h);
      tick(dEl, d);
      prevSec = s;
    }
  }

  update();
  setInterval(update, 250);
</script>
